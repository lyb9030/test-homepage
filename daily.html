<body>

```
<!-- 상단 메뉴 -->
<div class="top-menu">
<div class="menu-container">

    <a href="index.html" class="home-button">
        홈
    </a>

    <div class="menu-item" id="schedulerMenu">

            <button class="menu-button" onclick="toggleSchedulerMenu()">
                스케줄러 ▼
            </button>

            <div class="submenu">

                <a href="daily.html">
                    일퀘
                </a>

                <a href="boss.html">
                    보스
                </a>

            </div>

        </div>

    </div>
</div>


<!-- 일퀘 스케줄러 -->
<div class="container">

    <div class="scheduler-box">

        <h1>일퀘 스케줄러</h1>

        <div class="week-info" id="weekInfo">
            주차 정보를 불러오는 중...
        </div>


        <!-- 캐릭터 추가 -->
        <div class="character-add">

            <input
                type="text"
                id="characterInput"
                placeholder="캐릭터명을 입력하세요"
                maxlength="20"
            >

            <button onclick="addCharacter()">
                캐릭터 추가
            </button>

        </div>


        <!-- 일퀘 표 -->
        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>캐릭터</th>
                        <th>목</th>
                        <th>금</th>
                        <th>토</th>
                        <th>일</th>
                        <th>월</th>
                        <th>화</th>
                        <th>수</th>
                    </tr>
                </thead>

                <tbody id="characterTable">
                </tbody>

            </table>

        </div>


        <div class="guide">
            O / X 버튼을 클릭하여 일일 퀘스트 완료 여부를 변경할 수 있습니다.
        </div>

    </div>

</div>


<script>

    /* =========================================
       주차 계산
       목요일 ~ 수요일
    ========================================= */

    function getWeekStart(date) {

        const result = new Date(date);

        const day = result.getDay();

        /*
            일요일 = 0
            월요일 = 1
            화요일 = 2
            수요일 = 3
            목요일 = 4
            금요일 = 5
            토요일 = 6
        */

        let difference = day - 4;

        if (difference < 0) {
            difference += 7;
        }

        result.setDate(result.getDate() - difference);

        result.setHours(0, 0, 0, 0);

        return result;
    }


    /* =========================================
       날짜 표시
    ========================================= */

    function formatDate(date) {

        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");

        return `${year}.${month}.${day}`;
    }


    /* =========================================
       현재 주차 표시
    ========================================= */

    function displayWeek() {

        const today = new Date();

        const start = getWeekStart(today);

        const end = new Date(start);

        end.setDate(start.getDate() + 6);

        document.getElementById("weekInfo").textContent =
            `${formatDate(start)} (목) ~ ${formatDate(end)} (수)`;
    }


    /* =========================================
       저장 데이터
    ========================================= */

    const weekKey = formatDate(getWeekStart(new Date()));

    const storageKey = "dailyScheduler_" + weekKey;


    let characters = JSON.parse(
        localStorage.getItem(storageKey)
    ) || [];


    /* =========================================
       캐릭터 저장
    ========================================= */

    function saveCharacters() {

        localStorage.setItem(
            storageKey,
            JSON.stringify(characters)
        );

    }


    /* =========================================
       캐릭터 추가
    ========================================= */

    function addCharacter() {

        const input =
            document.getElementById("characterInput");

        const name = input.value.trim();

        if (name === "") {

            alert("캐릭터명을 입력해주세요.");

            return;
        }


        characters.push({

            name: name,

            days: [
                false,
                false,
                false,
                false,
                false,
                false,
                false
            ]

        });


        saveCharacters();

        input.value = "";

        renderTable();

    }


    /* =========================================
       캐릭터 삭제
    ========================================= */

    function deleteCharacter(index) {

        const character =
            characters[index];

        if (!confirm(
            `"${character.name}" 캐릭터를 삭제할까요?`
        )) {

            return;
        }


        characters.splice(index, 1);

        saveCharacters();

        renderTable();

    }


    /* =========================================
       O / X 변경
    ========================================= */

    function toggleDay(characterIndex, dayIndex) {

        characters[characterIndex].days[dayIndex] =
            !characters[characterIndex].days[dayIndex];

        saveCharacters();

        renderTable();

    }


    /* =========================================
       표 출력
    ========================================= */

    function renderTable() {

        const table =
            document.getElementById("characterTable");

        table.innerHTML = "";


        characters.forEach((character, characterIndex) => {

            const row =
                document.createElement("tr");


            /* 캐릭터명 */

            const nameCell =
                document.createElement("td");

            nameCell.textContent =
                character.name;


            /* 삭제 버튼 */

            const deleteButton =
                document.createElement("button");

            deleteButton.textContent = "삭제";

            deleteButton.className =
                "delete-button";

            deleteButton.onclick = function() {

                deleteCharacter(characterIndex);

            };


            nameCell.appendChild(deleteButton);

            row.appendChild(nameCell);


            /* 월~일 상태 */

            for (let dayIndex = 0; dayIndex < 7; dayIndex++) {

                const cell =
                    document.createElement("td");


                const button =
                    document.createElement("button");


                const isDone =
                    character.days[dayIndex];


                button.textContent =
                    isDone ? "O" : "X";


                button.className =
                    "status-button " +
                    (isDone
                        ? "done"
                        : "not-done");


                button.onclick = function() {

                    toggleDay(
                        characterIndex,
                        dayIndex
                    );

                };


                cell.appendChild(button);

                row.appendChild(cell);

            }


            table.appendChild(row);

        });

    }


    /* =========================================
       스케줄러 메뉴
    ========================================= */

    function toggleSchedulerMenu() {

        const menu =
            document.getElementById("schedulerMenu");

        menu.classList.toggle("active");

    }


    /* =========================================
       바깥 클릭 시 메뉴 닫기
    ========================================= */

    document.addEventListener(
        "click",
        function(event) {

            const menu =
                document.getElementById("schedulerMenu");

            if (!menu.contains(event.target)) {

                menu.classList.remove("active");

            }

        }
    );


    /* =========================================
       엔터키로 캐릭터 추가
    ========================================= */

    document.getElementById(
        "characterInput"
    ).addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                addCharacter();

            }

        }
    );


    /* =========================================
       초기 실행
    ========================================= */

    displayWeek();

    renderTable();

</script>

</body>
</html>
