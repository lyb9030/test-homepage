<style>
    * {
        box-sizing: border-box;
    }

    body {

        font-family: Arial, sans-serif;

        color: #222;
    }

    /* =========================
       상단 메뉴
    ========================= */

    .top-menu {
        width: 100%;
        background: #222;
    }

    .menu-container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 20px;
    }

    .home-button {
        display: inline-block;
        color: white;
        text-decoration: none;
        font-size: 18px;
        padding: 15px 20px;
    }

    .home-button:hover {
        background: #444;
    }

    .menu-item {
        position: relative;
        display: inline-block;
    }

    .menu-button {
        background: none;
        border: none;
        color: white;
        font-size: 18px;
        padding: 15px 20px;

    }

    .menu-button:hover {
        background: #444;
    }

    /* =========================
       스케줄러 하위 메뉴
    ========================= */

    .submenu {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        min-width: 140px;
        background: white;
        border-radius: 0 0 8px 8px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        overflow: hidden;
        z-index: 100;
    }

    .menu-item.active .submenu {
        display: block;
    }

    .submenu a {
        display: block;
        padding: 12px 20px;
        color: #222;
        text-decoration: none;
        text-align: left;
        font-size: 16px;
    }

    .submenu a:hover {
        background: #f0f0f0;
    }

    /* =========================
       메인 컨테이너
    ========================= */

    .container {
        max-width: 1100px;
        margin: 50px auto;
        padding: 0 20px;
    }

    .scheduler-box {
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
    }

    h1 {
        margin-top: 0;
        font-size: 32px;
    }

    /* =========================
       주차 정보
    ========================= */

    .week-info {
        margin: 20px 0 30px;
        padding: 15px;
        background: #f5f5f5;
        border-radius: 10px;
        font-size: 17px;
        font-weight: bold;
    }

    /* =========================
       캐릭터 추가
    ========================= */

    .character-add {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
    }

    .character-add input {
        flex: 1;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
    }

    .character-add input:focus {
        border-color: #888;
    }

    .character-add button {
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        background: #222;
        color: white;
        cursor: pointer;
        font-size: 16px;
    }

    .character-add button:hover {
        background: #444;
    }

    /* =========================
       일퀘 표
    ========================= */

    .table-wrapper {
        overflow-x: auto;
    }

    table {
        width: 100%;
        min-width: 750px;
        border-collapse: collapse;
    }

    th,
    td {
        border: 1px solid #ddd;
        text-align: center;
        padding: 12px 8px;
    }

    th {
        background: #f0f0f0;
        font-weight: bold;
    }

    th:first-child,
    td:first-child {
        width: 160px;
    }

    /* =========================
       O / X 버튼
    ========================= */

    .status-button {
        width: 42px;
        height: 36px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 17px;
        font-weight: bold;
    }

    .status-button.done {
        background: #222;
        color: white;
    }

    .status-button.not-done {
        background: #eee;
        color: #888;
    }

    .status-button:hover {
        opacity: 0.75;
    }

    /* =========================
       캐릭터 삭제
    ========================= */

    .delete-button {
        margin-left: 8px;
        padding: 5px 8px;
        border: none;
        border-radius: 5px;
        background: #eee;
        color: #666;
        cursor: pointer;
    }

    .delete-button:hover {
        background: #ddd;
    }

    /* =========================
       안내 문구
    ========================= */

    .guide {
        margin-top: 25px;
        color: #777;
        font-size: 14px;
    }

    /* =========================
       모바일
    ========================= */

    @media (max-width: 600px) {

        .scheduler-box {
            padding: 20px;
        }

        h1 {
            font-size: 26px;
        }

        .character-add {
            flex-direction: column;
        }

        .character-add button {
            width: 100%;
        }

        .menu-button,
        .home-button {
            font-size: 16px;
            padding: 14px;
        }
    }
</style>

<body>

```
<!-- =========================
     상단 메뉴
========================= -->

<div class="top-menu">

    <div class="menu-container">

        <a href="index.html" class="home-button">
            홈
        </a>

        <div class="menu-item" id="schedulerMenu">

            <button
                class="menu-button"
                onclick="toggleSchedulerMenu()"
            >
                스케줄러 ▼
            </button>

            <div class="submenu">

                <a href="daily.html">
                    일퀘
                </a>

                <a href="boss.html">
                    보스
                </a>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     일퀘 스케줄러
========================= -->

<div class="container">

    <div class="scheduler-box">

        <h1>일퀘 스케줄러</h1>

        <div
            class="week-info"
            id="weekInfo"
        >
            주차 정보를 불러오는 중...
        </div>


        <!-- 캐릭터 추가 -->

        <div class="character-add">

            <input
                type="text"
                id="characterInput"
                placeholder="캐릭터명을 입력하세요"
                maxlength="20"
            >

            <button
                type="button"
                onclick="addCharacter()"
            >
                캐릭터 추가
            </button>

        </div>


        <!-- 일퀘 표 -->

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>캐릭터</th>
                        <th>목</th>
                        <th>금</th>
                        <th>토</th>
                        <th>일</th>
                        <th>월</th>
                        <th>화</th>
                        <th>수</th>
                    </tr>

                </thead>

                <tbody id="characterTable">
                </tbody>

            </table>

        </div>


        <div class="guide">
            O / X 버튼을 클릭하여 일일 퀘스트 완료 여부를 변경할 수 있습니다.
        </div>

    </div>

</div>


<script>

    /* =========================
       주차 계산
       목요일 ~ 수요일
    ========================= */

    function getWeekStart(date) {

        const result = new Date(date);

        const day = result.getDay();

        let difference = day - 4;

        if (difference < 0) {
            difference += 7;
        }

        result.setDate(
            result.getDate() - difference
        );

        result.setHours(
            0,
            0,
            0,
            0
        );

        return result;
    }


    /* =========================
       날짜 표시
    ========================= */

    function formatDate(date) {

        const year =
            date.getFullYear();

        const month =
            String(
                date.getMonth() + 1
            ).padStart(2, "0");

        const day =
            String(
                date.getDate()
            ).padStart(2, "0");

        return `${year}.${month}.${day}`;
    }


    /* =========================
       현재 주차 표시
    ========================= */

    function displayWeek() {

        const today =
            new Date();

        const start =
            getWeekStart(today);

        const end =
            new Date(start);

        end.setDate(
            start.getDate() + 6
        );

        document.getElementById(
            "weekInfo"
        ).textContent =
            `${formatDate(start)} (목) ~ ${formatDate(end)} (수)`;
    }


    /* =========================
       저장 키
    ========================= */

    const weekKey =
        formatDate(
            getWeekStart(
                new Date()
            )
        );

    const storageKey =
        "dailyScheduler_" + weekKey;


    /* =========================
       저장 데이터 불러오기
    ========================= */

    let characters = [];

    try {

        const savedData =
            localStorage.getItem(
                storageKey
            );

        if (savedData) {

            const parsedData =
                JSON.parse(savedData);

            if (Array.isArray(parsedData)) {

                characters =
                    parsedData;

            }

        }

    } catch (error) {

        console.error(
            "저장된 데이터를 불러오지 못했습니다.",
            error
        );

        characters = [];

    }


    /* =========================
       데이터 저장
    ========================= */

    function saveCharacters() {

        try {

            localStorage.setItem(
                storageKey,
                JSON.stringify(characters)
            );

        } catch (error) {

            console.error(
                "데이터 저장에 실패했습니다.",
                error
            );

        }

    }


    /* =========================
       캐릭터 추가
    ========================= */

    function addCharacter() {

        const input =
            document.getElementById(
                "characterInput"
            );

        const name =
            input.value.trim();


        if (name === "") {

            alert(
                "캐릭터명을 입력해주세요."
            );

            input.focus();

            return;

        }


        characters.push({

            name: name,

            days: [
                false,
                false,
                false,
                false,
                false,
                false,
                false
            ]

        });


        saveCharacters();

        input.value = "";

        input.focus();

        renderTable();

    }


    /* =========================
       캐릭터 삭제
    ========================= */

    function deleteCharacter(index) {

        const character =
            characters[index];


        if (!character) {

            return;

        }


        const result =
            confirm(
                `"${character.name}" 캐릭터를 삭제할까요?`
            );


        if (!result) {

            return;

        }


        characters.splice(
            index,
            1
        );

        saveCharacters();

        renderTable();

    }


    /* =========================
       O / X 변경
    ========================= */

    function toggleDay(
        characterIndex,
        dayIndex
    ) {

        if (
            !characters[characterIndex]
        ) {

            return;

        }


        if (
            !Array.isArray(
                characters[characterIndex].days
            )
        ) {

            characters[characterIndex].days =
                [
                    false,
                    false,
                    false,
                    false,
                    false,
                    false,
                    false
                ];

        }


        characters[characterIndex].days[dayIndex] =
            !characters[characterIndex].days[dayIndex];


        saveCharacters();

        renderTable();

    }


    /* =========================
       표 출력
    ========================= */

    function renderTable() {

        const table =
            document.getElementById(
                "characterTable"
            );


        table.innerHTML = "";


        characters.forEach(
            function(
                character,
                characterIndex
            ) {

                const row =
                    document.createElement(
                        "tr"
                    );


                /* 캐릭터명 */

                const nameCell =
                    document.createElement(
                        "td"
                    );

                nameCell.textContent =
                    character.name;


                /* 삭제 버튼 */

                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.type =
                    "button";

                deleteButton.textContent =
                    "삭제";

                deleteButton.className =
                    "delete-button";

                deleteButton.onclick =
                    function() {

                        deleteCharacter(
                            characterIndex
                        );

                    };


                nameCell.appendChild(
                    deleteButton
                );

                row.appendChild(
                    nameCell
                );


                /* 목 ~ 수 */

                for (
                    let dayIndex = 0;
                    dayIndex < 7;
                    dayIndex++
                ) {

                    const cell =
                        document.createElement(
                            "td"
                        );


                    const button =
                        document.createElement(
                            "button"
                        );

                    button.type =
                        "button";


                    const isDone =
                        Array.isArray(
                            character.days
                        ) &&
                        character.days[dayIndex] === true;


                    button.textContent =
                        isDone ? "O" : "X";


                    button.className =
                        "status-button " +
                        (
                            isDone
                                ? "done"
                                : "not-done"
                        );


                    button.onclick =
                        function() {

                            toggleDay(
                                characterIndex,
                                dayIndex
                            );

                        };


                    cell.appendChild(
                        button
                    );

                    row.appendChild(
                        cell
                    );

                }


                table.appendChild(
                    row
                );

            }
        );

    }


    /* =========================
       스케줄러 메뉴
    ========================= */

    function toggleSchedulerMenu() {

        const menu =
            document.getElementById(
                "schedulerMenu"
            );

        menu.classList.toggle(
            "active"
        );

    }


    /* =========================
       메뉴 바깥 클릭
    ========================= */

    document.addEventListener(
        "click",
        function(event) {

            const menu =
                document.getElementById(
                    "schedulerMenu"
                );


            if (
                !menu.contains(
                    event.target
                )
            ) {

                menu.classList.remove(
                    "active"
                );

            }

        }
    );


    /* =========================
       엔터키로 캐릭터 추가
    ========================= */

    document.getElementById(
        "characterInput"
    ).addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                addCharacter();

            }

        }
    );


    /* =========================
       초기 실행
    ========================= */

    displayWeek();

    renderTable();

</script>

</body>
</html>
