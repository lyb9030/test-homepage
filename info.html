```html
<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>정보 - My Homepage</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;

        font-family: Arial, sans-serif;

        background: #f5f5f5;

        color: #222;
    }


    /* =========================
       상단 메뉴
    ========================= */

    .top-menu {
        width: 100%;

        background: #222;
    }


    .menu-container {
        max-width: 1100px;

        margin: 0 auto;

        padding: 0 20px;

        display: flex;

        align-items: center;
    }


    .home-button {
        display: inline-block;

        padding: 15px 20px;

        color: white;

        text-decoration: none;

        font-size: 18px;
    }


    .home-button:hover {
        background: #444;
    }



    /* =========================
       정보 화면
    ========================= */

    .info-container {
        max-width: 1100px;

        margin: 70px auto;

        padding: 0 20px;
    }


    .info-title {
        margin: 0 0 40px;

        font-size: 42px;
    }



    /* =========================
       정보 카드
    ========================= */

    .info-card {
        background: white;

        padding: 35px;

        border-radius: 20px;

        box-shadow:
            0 5px 20px rgba(0, 0, 0, 0.05);
    }


    .info-card h2 {
        margin: 0 0 10px;

        font-size: 27px;
    }


    .info-card p {
        margin: 0 0 25px;

        color: #666;

        font-size: 16px;

        line-height: 1.6;
    }



    /* =========================
       API Key 영역
    ========================= */

    .api-key-area {
        margin-top: 25px;

        margin-bottom: 25px;
    }


    .api-key-label {
        display: block;

        margin-bottom: 10px;

        font-size: 16px;

        font-weight: bold;
    }


    .api-key-row {
        display: flex;

        gap: 10px;
    }


    .api-key-input {
        flex: 1;

        min-width: 0;

        padding: 13px 15px;

        border: 1px solid #ddd;

        border-radius: 10px;

        font-size: 15px;

        outline: none;
    }


    .api-key-input:focus {
        border-color: #999;
    }



    /* =========================
       버튼
    ========================= */

    .button-row {
        display: flex;

        gap: 10px;

        flex-wrap: wrap;
    }


    .button {
        padding: 12px 20px;

        border: none;

        border-radius: 10px;

        background: #222;

        color: white;

        font-size: 15px;

        cursor: pointer;
    }


    .button:hover {
        background: #444;
    }


    .button.secondary {
        background: #777;
    }


    .button.secondary:hover {
        background: #555;
    }


    .button:disabled {
        background: #999;

        cursor: not-allowed;
    }



    /* =========================
       저장 상태
    ========================= */

    .save-status {
        margin-top: 10px;

        color: #666;

        font-size: 14px;
    }



    /* =========================
       결과 영역
    ========================= */

    .result-area {
        margin-top: 35px;

        padding-top: 30px;

        border-top: 1px solid #eee;
    }


    .result-area h3 {
        margin: 0 0 20px;

        font-size: 20px;
    }


    .character-list {
        display: grid;

        grid-template-columns:
            repeat(3, minmax(0, 1fr));

        gap: 12px;
    }


    .character-item {
        padding: 15px;

        background: #f5f5f5;

        border-radius: 10px;

        font-size: 16px;

        font-weight: bold;
    }


    .status {
        margin-top: 20px;

        color: #666;

        font-size: 14px;

        line-height: 1.6;
    }



    /* =========================
       모바일
    ========================= */

    @media (max-width: 700px) {

        .menu-container {
            padding: 0 10px;
        }


        .home-button {
            padding: 14px 12px;

            font-size: 16px;
        }


        .info-container {
            margin: 45px auto;
        }


        .info-title {
            font-size: 32px;
        }


        .info-card {
            padding: 28px;
        }


        .api-key-row {
            flex-direction: column;
        }


        .character-list {
            grid-template-columns: 1fr;
        }

    }

</style>

</head>


<body>


<!-- =========================
     상단 메뉴
========================= -->

<div class="top-menu">

    <div class="menu-container">

        <a
            href="index.html"
            class="home-button"
        >
            홈
        </a>

    </div>

</div>



<!-- =========================
     정보 화면
========================= -->

<main class="info-container">


    <h1 class="info-title">
        정보
    </h1>



    <!-- =========================
         캐릭터 목록 조회
    ========================= -->

    <section class="info-card">

        <h2>
            캐릭터 목록 조회
        </h2>


        <p>
            메이플스토리 계정에 등록된 캐릭터 목록을 조회합니다.
        </p>



        <!-- =========================
             API Key 입력
        ========================= -->

        <div class="api-key-area">

            <label
                class="api-key-label"
                for="apiKey"
            >
                API Key
            </label>


            <div class="api-key-row">

                <input
                    type="password"
                    id="apiKey"
                    class="api-key-input"
                    placeholder="API Key를 입력하세요"
                >

            </div>


            <div class="button-row" style="margin-top: 10px;">

                <button
                    class="button"
                    onclick="saveApiKey()"
                >
                    저장
                </button>


                <button
                    class="button secondary"
                    onclick="deleteApiKey()"
                >
                    저장된 Key 삭제
                </button>

            </div>


            <div
                class="save-status"
                id="saveStatus"
            ></div>

        </div>



        <!-- =========================
             조회 버튼
        ========================= -->

        <div class="button-row">

            <button
                class="button"
                id="searchButton"
                onclick="getCharacterList()"
            >
                캐릭터 목록 불러오기
            </button>

        </div>



        <!-- =========================
             조회 결과
        ========================= -->

        <div
            class="result-area"
            id="resultArea"
            style="display: none;"
        >

            <h3>
                조회 결과
            </h3>


            <div
                class="character-list"
                id="characterList"
            ></div>


            <div
                class="status"
                id="status"
            ></div>

        </div>

    </section>

</main>



<!-- =========================
     JavaScript
========================= -->

<script>


    /* =========================
       API 주소
    ========================= */

    const API_URL =
        "https://open.api.nexon.com/maplestory/v1/character/list";



    /* =========================
       페이지 시작
    ========================= */

    window.addEventListener(
        "DOMContentLoaded",
        function() {

            const savedKey =
                localStorage.getItem(
                    "mapleStoryApiKey"
                );


            if (savedKey) {

                document.getElementById(
                    "apiKey"
                ).value = savedKey;


                document.getElementById(
                    "saveStatus"
                ).textContent =
                    "저장된 API Key를 불러왔습니다.";

            }

        }
    );



    /* =========================
       API Key 저장
    ========================= */

    function saveApiKey() {

        const input =
            document.getElementById(
                "apiKey"
            );


        const key =
            input.value.trim();


        if (!key) {

            alert(
                "API Key를 입력해주세요."
            );

            return;

        }


        localStorage.setItem(
            "mapleStoryApiKey",
            key
        );


        document.getElementById(
            "saveStatus"
        ).textContent =
            "API Key가 저장되었습니다.";

    }



    /* =========================
       API Key 삭제
    ========================= */

    function deleteApiKey() {

        localStorage.removeItem(
            "mapleStoryApiKey"
        );


        document.getElementById(
            "apiKey"
        ).value = "";


        document.getElementById(
            "saveStatus"
        ).textContent =
            "저장된 API Key를 삭제했습니다.";

    }



    /* =========================
       캐릭터 목록 조회
    ========================= */

    async function getCharacterList() {


        const apiKeyInput =
            document.getElementById(
                "apiKey"
            );


        const button =
            document.getElementById(
                "searchButton"
            );


        const resultArea =
            document.getElementById(
                "resultArea"
            );


        const characterList =
            document.getElementById(
                "characterList"
            );


        const status =
            document.getElementById(
                "status"
            );


        /* =========================
           API Key 확인
        ========================= */

        const apiKey =
            apiKeyInput.value.trim();


        if (!apiKey) {

            alert(
                "API Key를 입력해주세요."
            );

            apiKeyInput.focus();

            return;

        }



        /* =========================
           조회 시작
        ========================= */

        button.disabled = true;

        button.textContent =
            "조회 중...";


        resultArea.style.display =
            "block";


        characterList.innerHTML =
            "";


        status.textContent =
            "캐릭터 목록을 불러오는 중입니다.";



        try {


            /* =========================
               API 요청
            ========================= */

            const response =
                await fetch(
                    API_URL,
                    {
                        method: "GET",

                        headers: {
                            "x-nxopen-api-key":
                                apiKey
                        }
                    }
                );



            /* =========================
               응답 확인
            ========================= */

            const data =
                await response.json();



            console.log(
                "API 응답:",
                data
            );



            /* =========================
               API 오류
            ========================= */

            if (!response.ok) {

                if (
                    data &&
                    data.error
                ) {

                    throw new Error(
                        data.error.message ||
                        "API 요청에 실패했습니다."
                    );

                }


                throw new Error(
                    "API 요청에 실패했습니다." +
                    " HTTP 상태 코드: " +
                    response.status
                );

            }



            /* =========================
               캐릭터 목록 확인
            ========================= */

            if (
                !data ||
                !data.character_list ||
                data.character_list.length === 0
            ) {

                characterList.innerHTML =
                    "<div class='character-item'>" +
                    "조회된 캐릭터가 없습니다." +
                    "</div>";


                status.textContent =
                    "조회는 정상적으로 완료되었습니다.";


                return;

            }



            /* =========================
               캐릭터 표시
            ========================= */

            data.character_list.forEach(
                function(character) {

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "character-item";


                    item.textContent =
                        character.character_name;


                    characterList.appendChild(
                        item
                    );

                }
            );



            /* =========================
               조회 완료
            ========================= */

            status.textContent =
                "총 " +
                data.character_list.length +
                "개의 캐릭터를 조회했습니다.";

        }


        catch (error) {

            console.error(
                "API 오류:",
                error
            );


            characterList.innerHTML =
                "<div class='character-item'>" +
                "캐릭터 목록을 불러오지 못했습니다." +
                "</div>";


            status.textContent =
                "오류: " +
                error.message;

        }


        finally {

            button.disabled =
                false;


            button.textContent =
                "캐릭터 목록 불러오기";

        }

    }

</script>


</body>
</html>
