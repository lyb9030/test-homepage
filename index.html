<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Homepage</title>

<style>

    * {
        box-sizing: border-box;
    }


    body {
        margin: 0;

        font-family: Arial, sans-serif;

        background: #f5f5f5;

        color: #222;
    }



    /* =========================
       홈 화면
    ========================= */

    .home-container {
        max-width: 1100px;

        margin: 70px auto;

        padding: 0 20px;
    }



    /* =========================
       환영 영역
    ========================= */

    .welcome {
        margin-bottom: 40px;

        text-align: left;
    }


    .welcome h1 {
        margin: 0 0 12px;

        font-size: 42px;
    }


    .welcome p {
        margin: 0;

        color: #666;

        font-size: 18px;
    }



    /* =========================
       기능 카드
    ========================= */

    .card-container {
        display: grid;

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 25px;
    }


    .feature-card {
        display: block;

        padding: 35px;

        background: white;

        border-radius: 20px;

        text-decoration: none;

        color: #222;

        box-shadow:
            0 5px 20px rgba(0, 0, 0, 0.05);

        transition:
            transform 0.2s,
            box-shadow 0.2s;
    }


    .feature-card:hover {
        transform: translateY(-5px);

        box-shadow:
            0 10px 30px rgba(0, 0, 0, 0.12);
    }


    .card-icon {
        font-size: 42px;

        margin-bottom: 20px;
    }


    .feature-card h2 {
        margin: 0 0 10px;

        font-size: 27px;
    }


    .feature-card p {
        margin: 0 0 25px;

        color: #666;

        font-size: 16px;

        line-height: 1.6;
    }


    .card-link {
        font-size: 15px;

        font-weight: bold;

        color: #555;
    }



    /* =========================
       모바일
    ========================= */

    @media (max-width: 700px) {

        .home-container {
            margin: 45px auto;
        }


        .welcome h1 {
            font-size: 32px;
        }


        .welcome p {
            font-size: 16px;
        }


        .card-container {
            grid-template-columns: 1fr;

            gap: 18px;
        }


        .feature-card {
            padding: 28px;
        }

    }

</style>

</head>


<body>


<!-- =========================
     공통 상단 메뉴
========================= -->

<div id="main-header"></div>



<!-- =========================
     홈 화면
========================= -->

<main class="home-container">


    <!-- 환영 문구 -->

    <section class="welcome">

        <h1>
            안녕하세요 👋
        </h1>

        <p>
            나의 첫 번째 홈페이지입니다.
        </p>

    </section>



    <!-- 기능 카드 -->

    <section class="card-container">


        <!-- =========================
             일퀘
        ========================= -->

        <a
            href="daily.html"
            class="feature-card"
        >

            <div class="card-icon">
                📋
            </div>

            <h2>
                일퀘
            </h2>

            <p>
                캐릭터별 일일 퀘스트를
                관리할 수 있습니다.
            </p>

            <div class="card-link">
                일퀘 스케줄러 바로가기 →
            </div>

        </a>



        <!-- =========================
             보스
        ========================= -->

        <a
            href="boss.html"
            class="feature-card"
        >

            <div class="card-icon">
                👑
            </div>

            <h2>
                보스
            </h2>

            <p>
                보스 출현 일정과
                진행 상황을 관리할 수 있습니다.
            </p>

            <div class="card-link">
                보스 스케줄러 바로가기 →
            </div>

        </a>


    </section>

</main>



<!-- =========================
     공통 헤더 불러오기
========================= -->

<script>

    fetch("main-header.html")
        .then(
            response => response.text()
        )
        .then(
            html => {

                document.getElementById(
                    "main-header"
                ).innerHTML = html;

            }
        )
        .catch(
            error => {

                console.error(
                    "공통 헤더를 불러오지 못했습니다:",
                    error
                );

            }
        );

</script>


</body>
</html>
