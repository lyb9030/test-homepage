<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Homepage</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #222;
    }


    /* =========================
       상단 메뉴
    ========================= */

    .top-menu {
        width: 100%;
        background: #222;
    }

    .menu-container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 20px;
        display: flex;
        align-items: center;
    }


    /* 홈 */

    .home-button {
        display: inline-block;

        padding: 15px 20px;

        color: white;
        text-decoration: none;

        font-size: 18px;
    }

    .home-button:hover {
        background: #444;
    }


    /* 스케줄러 */

    .menu-item {
        position: relative;
        display: inline-block;
    }

    .menu-button {
        background: none;
        border: none;

        color: white;

        font-size: 18px;

        padding: 15px 20px;

        cursor: pointer;
    }

    .menu-button:hover {
        background: #444;
    }


    /* =========================
       스케줄러 하위 메뉴
    ========================= */

    .submenu {
        display: none;

        position: absolute;

        top: calc(100% + 8px);
        left: 0;

        width: 220px;

        background: white;

        border-radius: 12px;

        box-shadow:
            0 8px 25px rgba(0, 0, 0, 0.15);

        overflow: hidden;

        z-index: 100;
    }

    .menu-item.active .submenu {
        display: block;
    }


    .submenu a {
        display: block;

        padding: 18px 20px;

        color: #222;

        text-decoration: none;

        text-align: left;

        font-size: 17px;

        font-weight: bold;

        border-bottom: 1px solid #eee;

        transition:
            background 0.2s,
            padding-left 0.2s;
    }

    .submenu a:last-child {
        border-bottom: none;
    }

    .submenu a:hover {
        background: #f5f5f5;

        padding-left: 25px;
    }


    /* =========================
       홈 화면
    ========================= */

    .home-container {
        max-width: 1100px;

        margin: 70px auto;

        padding: 0 20px;
    }


    /* 환영 영역 */

    .welcome {
        margin-bottom: 40px;

        text-align: left;
    }

    .welcome h1 {
        margin: 0 0 12px;

        font-size: 42px;
    }

    .welcome p {
        margin: 0;

        color: #666;

        font-size: 18px;
    }


    /* =========================
       기능 카드
    ========================= */

    .card-container {
        display: grid;

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 25px;
    }


    .feature-card {
        display: block;

        padding: 35px;

        background: white;

        border-radius: 20px;

        text-decoration: none;

        color: #222;

        box-shadow:
            0 5px 20px rgba(0, 0, 0, 0.05);

        transition:
            transform 0.2s,
            box-shadow 0.2s;
    }


    .feature-card:hover {
        transform: translateY(-5px);

        box-shadow:
            0 10px 30px rgba(0, 0, 0, 0.12);
    }


    .card-icon {
        font-size: 42px;

        margin-bottom: 20px;
    }


    .feature-card h2 {
        margin: 0 0 10px;

        font-size: 27px;
    }


    .feature-card p {
        margin: 0 0 25px;

        color: #666;

        font-size: 16px;

        line-height: 1.6;
    }


    .card-link {
        font-size: 15px;

        font-weight: bold;

        color: #555;
    }


    /* =========================
       모바일
    ========================= */

    @media (max-width: 700px) {

        .menu-container {
            padding: 0 10px;
        }

        .home-button,
        .menu-button {
            padding: 14px 12px;

            font-size: 16px;
        }


        .home-container {
            margin: 45px auto;
        }


        .welcome h1 {
            font-size: 32px;
        }

        .welcome p {
            font-size: 16px;
        }


        .card-container {
            grid-template-columns: 1fr;

            gap: 18px;
        }


        .feature-card {
            padding: 28px;
        }

    }
</style>

</head>

<body>

<!-- =========================
     상단 메뉴
========================= -->

<div class="top-menu">

    <div class="menu-container">

        <a
            href="index.html"
            class="home-button"
        >
            홈
        </a>


        <div
            class="menu-item"
            id="schedulerMenu"
        >

            <button
                class="menu-button"
                onclick="toggleSchedulerMenu()"
            >
                스케줄러 ▼
            </button>


            <div class="submenu">

                <a href="daily.html">
                    일퀘
                </a>

                <a href="boss.html">
                    보스
                </a>

            </div>

        </div>

    </div>

</div>



<!-- =========================
     홈 화면
========================= -->

<main class="home-container">


    <!-- 환영 문구 -->

    <section class="welcome">

        <h1>
            안녕하세요 👋
        </h1>

        <p>
            나의 첫 번째 홈페이지입니다.
        </p>

    </section>



    <!-- 기능 카드 -->

    <section class="card-container">


        <!-- 일퀘 -->

        <a
            href="daily.html"
            class="feature-card"
        >

            <div class="card-icon">
                📋
            </div>

            <h2>
                일퀘
            </h2>

            <p>
                캐릭터별 일일 퀘스트를
                관리할 수 있습니다.
            </p>

            <div class="card-link">
                일퀘 스케줄러 바로가기 →
            </div>

        </a>



        <!-- 보스 -->

        <a
            href="boss.html"
            class="feature-card"
        >

            <div class="card-icon">
                👑
            </div>

            <h2>
                보스
            </h2>

            <p>
                보스 출현 일정과
                진행 상황을 관리할 수 있습니다.
            </p>

            <div class="card-link">
                보스 스케줄러 바로가기 →
            </div>

        </a>


    </section>

</main>



<!-- =========================
     JavaScript
========================= -->

<script>

    function toggleSchedulerMenu() {

        const menu =
            document.getElementById(
                "schedulerMenu"
            );

        menu.classList.toggle(
            "active"
        );

    }


    /* 메뉴 바깥 클릭 시 닫기 */

    document.addEventListener(
        "click",
        function(event) {

            const menu =
                document.getElementById(
                    "schedulerMenu"
                );


            if (
                !menu.contains(
                    event.target
                )
            ) {

                menu.classList.remove(
                    "active"
                );

            }

        }
    );

</script>

</body>
</html>
