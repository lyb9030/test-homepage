<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보스 스케줄러</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .top-menu {
            width: 100%;
            background: #222;
        }

        .menu-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 12px;
        }

        .home-button,
        .menu-button {
            display: inline-block;
            padding: 13px 18px;
            color: white;
            text-decoration: none;
            font-size: 17px;
        }

        .menu-button {
            background: none;
            border: none;
            cursor: pointer;
        }

        .home-button:hover,
        .menu-button:hover {
            background: #444;
        }

        .menu-item {
            position: relative;
            display: inline-block;
        }

        .submenu {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            width: 190px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            z-index: 100;
        }

        .menu-item.active .submenu {
            display: block;
        }

        .submenu a {
            display: block;
            padding: 15px 18px;
            color: #222;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #eee;
        }

        .submenu a:last-child {
            border-bottom: none;
        }

        .submenu a:hover {
            background: #f5f5f5;
        }

        .container {
            width: min(98vw, 1600px);
            margin: 30px auto;
        }

        .scheduler-box {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        h1 {
            margin: 0 0 15px;
            font-size: 30px;
        }

        .week-info {
            margin-bottom: 18px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }

        .add-area {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            align-items: center;
        }

        .character-add-area input {
            flex: 0 1 320px;
        }

        .add-area input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        .add-area input:focus,
        .difficulty-select:focus {
            border-color: #888;
        }

        .add-area button {
            padding: 10px 18px;
            border: none;
            border-radius: 7px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .add-area button:hover {
            background: #444;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: visible;
        }

        table {
            width: 100%;
            min-width: 1100px;
            table-layout: fixed;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 5px 3px;
            text-align: center;
            vertical-align: middle;
            font-size: 13px;
        }

        th {
            background: #f0f0f0;
            font-weight: bold;
        }

        th:first-child,
        td:first-child {
            width: 115px;
            position: sticky;
            left: 0;
            z-index: 3;
            background: white;
        }

        th:first-child {
            background: #e9e9e9;
            z-index: 6;
        }

        .boss-header {
            position: sticky;
            top: 0;
            min-height: 62px;
            padding: 7px 4px;
            word-break: keep-all;
            background: #e9e9e9;
            z-index: 4;
        }

        .character-row:active {
            cursor: grabbing;
        }

        .character-row.dragging {
            opacity: 0.45;
        }

        .character-header {
            background: #e9e9e9;
            font-size: 12px;
            font-weight: bold;
        }

        .boss-name {
            display: block;
            margin-bottom: 6px;
            line-height: 1.15;
            word-break: break-word;
            font-size: 14px;
            font-weight: 800;
            color: #222;
        }

        .difficulty-select {
            width: 100%;
            padding: 5px 2px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: white;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
        }

        .character-row .difficulty-select {
            font-size: 11px;
            padding: 4px 1px;
            margin-bottom: 4px;
        }

        .delete-character {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 19px;
            height: 19px;
            margin-left: 5px;
            padding: 0;
            border: 1px solid #ddd;
            border-radius: 50%;
            background: white;
            color: #999;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            line-height: 1;
        }

        .delete-character:hover {
            background: #f0f0f0;
            color: #555;
            border-color: #bbb;
        }
        
        .value-row th,
        .value-row td {
            background: #fafafa;
        }

        .value-display {
            display: inline-block;
            white-space: nowrap;
            font-size: 12px;
        }

        .status-button {
            width: 34px;
            height: 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .status-button.done {
            background: #222;
            color: white;
        }

        .status-button.not-done {
            background: #eee;
            color: #888;
        }

        .status-button:hover {
            opacity: 0.75;
        }

        .character-name {
            display: inline-block;
            max-width: 75px;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
            font-weight: bold;
            word-break: break-all;
        }

        .character-row {
            cursor: grab;
        }

        .profit-row th,
        .profit-row td {
            background: #fafafa;
            font-weight: bold;
            font-size: 12px;
        }

        .profit-row th:first-child,
        .profit-row td:first-child {
            background: #fafafa;
        }

        .total-profit {
            margin-top: 18px;
            padding: 14px;
            border-radius: 8px;
            background: #f0f0f0;
            font-size: 18px;
            font-weight: bold;
            text-align: right;
        }

        .guide {
            margin-top: 14px;
            color: #777;
            font-size: 12px;
            line-height: 1.5;
        }

        @media (min-width: 1400px) {
            th,
            td {
                font-size: 12px;
                padding: 4px 2px;
            }

            th:first-child,
            td:first-child {
                width: 125px;
            }

            .status-button {
                width: 32px;
                height: 28px;
            }
        }

        @media (max-width: 900px) {
            .add-area {
                flex-wrap: wrap;
            }

            .character-add-area input {
                flex: 1 1 220px;
            }
        }

        @media (max-width: 700px) {
            .scheduler-box {
                padding: 16px;
            }

            h1 {
                font-size: 25px;
            }

            .add-area {
                flex-direction: column;
                align-items: stretch;
            }

            .add-area button {
                width: 100%;
            }

            .character-add-area input {
                width: 100%;
            }

            .home-button,
            .menu-button {
                padding: 12px 10px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="top-menu">
        <div class="menu-container">
            <a href="index.html" class="home-button">홈</a>

            <div class="menu-item" id="schedulerMenu">
                <button class="menu-button" onclick="toggleSchedulerMenu()">
                    스케줄러 ▼
                </button>

                <div class="submenu">
                    <a href="daily.html">일퀘</a>
                    <a href="boss.html">보스</a>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="scheduler-box">

            <h1>보스 스케줄러</h1>

            <div class="week-info" id="weekInfo">
                주차 정보를 불러오는 중...
            </div>

            <div class="add-area character-add-area">
                <input
                    type="text"
                    id="characterInput"
                    placeholder="캐릭터명"
                    maxlength="20"
                >

                <button type="button" onclick="addCharacterFromInput()">
                    캐릭터 추가
                </button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead id="bossHeader"></thead>
                    <tbody id="bossTable"></tbody>
                </table>
            </div>

            <div class="total-profit" id="totalProfit">
                이번 주 총 수익: 0 만 메소
            </div>

            <div class="guide">
                • 보스는 고정 목록으로 표시되며, 가로 방향으로 드래그하여 순서를 변경할 수 있습니다.
                <br>
                • 보스 열을 드래그하면 난이도 설정과 O/X 기록이 함께 이동합니다.
                <br>
                • 각 캐릭터별로 보스 난이도를 개별 선택할 수 있습니다.
                <br>
                • 선택한 난이도에 따라 결정값이 자동으로 적용됩니다.
                <br>
                • O / X는 이번 주 실제 격파 여부를 기록합니다.
                <br>
                • 난이도 설정은 유지되며, O / X 기록은 목요일~수요일 주차별로 저장됩니다.
            </div>

        </div>
    </div>

    <script>
        const FIXED_BOSSES = [
            { name: "자쿰", difficulties: [{ name: "카오스", value: 808 }] },
            { name: "블러드퀸", difficulties: [{ name: "카오스", value: 814 }] },
            { name: "반반", difficulties: [{ name: "카오스", value: 815 }] },
            { name: "피에르", difficulties: [{ name: "카오스", value: 817 }] },
            { name: "매그너스", difficulties: [{ name: "하드", value: 856 }] },
            { name: "벨룸", difficulties: [{ name: "카오스", value: 928 }] },
            { name: "파풀라투스", difficulties: [{ name: "카오스", value: 1310 }] },
            { name: "스우", difficulties: [{ name: "노말", value: 1670 }, { name: "하드", value: 5150 }] },
            { name: "데미안", difficulties: [{ name: "노말", value: 1750 }, { name: "하드", value: 4890 }] },
            { name: "슬라임", difficulties: [{ name: "노말", value: 2550 }, { name: "카오스", value: 6980 }] },
            { name: "루시드", difficulties: [{ name: "이지", value: 2980 }, { name: "노말", value: 3560 }, { name: "하드", value: 6290 }] },
            { name: "윌", difficulties: [{ name: "이지", value: 3230 }, { name: "노말", value: 4110 }, { name: "하드", value: 7710 }] },
            { name: "더스크", difficulties: [{ name: "노말", value: 4400 }, { name: "카오스", value: 6980 }] },
            { name: "듄켈", difficulties: [{ name: "노말", value: 4750 }, { name: "하드", value: 9440 }] },
            { name: "진힐라", difficulties: [{ name: "노말", value: 7120 }, { name: "하드", value: 10600 }] },
            { name: "세렌", difficulties: [{ name: "노말", value: 23900 }, { name: "하드", value: 35600 }] },
            { name: "칼로스", difficulties: [{ name: "이지", value: 28000 }] }
        ];

        function getWeekStart(date) {
            const result = new Date(date);
            const day = result.getDay();
            let difference = day - 4;

            if (difference < 0) {
                difference += 7;
            }

            result.setDate(result.getDate() - difference);
            result.setHours(0, 0, 0, 0);

            return result;
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");

            return `${year}.${month}.${day}`;
        }

        const weekKey = formatDate(getWeekStart(new Date()));
        const storageKey = "bossScheduler_" + weekKey;

        let data = {
            characters: [],
            bosses: FIXED_BOSSES.map(boss => ({
                name: boss.name,
                difficulties: boss.difficulties.map(item => ({
                    name: item.name,
                    value: item.value
                })),
                selectedDifficulty: boss.difficulties[0].name
            }))
        };

        try {
            const saved = localStorage.getItem(storageKey);

            if (saved) {
                const parsed = JSON.parse(saved);

                if (parsed && Array.isArray(parsed.characters)) {
                    data.characters = parsed.characters;
                }

                if (parsed && Array.isArray(parsed.bosses)) {
                    const savedBossMap = new Map(
                        parsed.bosses.map(boss => [boss.name, boss])
                    );

                    data.bosses = FIXED_BOSSES.map(fixedBoss => {
                        const savedBoss =
                            savedBossMap.get(fixedBoss.name);

                        const fixedDifficulties =
                            fixedBoss.difficulties.map(difficulty => ({
                                name: difficulty.name,
                                value: difficulty.value
                            }));

                        const selectedDifficulty =
                            savedBoss &&
                            fixedDifficulties.some(
                                difficulty =>
                                    difficulty.name ===
                                    savedBoss.selectedDifficulty
                            )
                                ? savedBoss.selectedDifficulty
                                : fixedDifficulties[0].name;

                        return {
                            name: fixedBoss.name,
                            difficulties: fixedDifficulties,
                            selectedDifficulty
                        };
                    });
                }
            }
        } catch (error) {
            console.error("저장 데이터를 불러오지 못했습니다.", error);
        }

        function normalizeData() {
            data.bosses.forEach(boss => {
                if (!Array.isArray(boss.difficulties)) {
                    const oldValue =
                        typeof boss.value === "number"
                            ? boss.value
                            : 0;

                    boss.difficulties = [
                        {
                            name: "기본",
                            value: oldValue
                        }
                    ];

                    boss.selectedDifficulty = "기본";
                    delete boss.value;
                }

                if (!boss.selectedDifficulty) {
                    boss.selectedDifficulty =
                        boss.difficulties[0]?.name || "기본";
                }

                if (boss.difficulties.length === 0) {
                    boss.difficulties.push({
                        name: "기본",
                        value: 0
                    });

                    boss.selectedDifficulty = "기본";
                }

                boss.difficulties.forEach(difficulty => {
                    if (
                        typeof difficulty.value !== "number" ||
                        Number.isNaN(difficulty.value)
                    ) {
                        difficulty.value = 0;
                    }
                });

                if (
                    !boss.difficulties.some(
                        difficulty =>
                            difficulty.name ===
                            boss.selectedDifficulty
                    )
                ) {
                    boss.selectedDifficulty =
                        boss.difficulties[0].name;
                }
            });

            data.characters.forEach(character => {
                if (!Array.isArray(character.status)) {
                    character.status = [];
                }

                while (
                    character.status.length <
                    data.bosses.length
                ) {
                    character.status.push(false);
                }

                character.status =
                    character.status.slice(
                        0,
                        data.bosses.length
                    );

                if (!Array.isArray(character.difficulties)) {
                    character.difficulties = [];
                }

                while (
                    character.difficulties.length <
                    data.bosses.length
                ) {
                    const boss =
                        data.bosses[character.difficulties.length];

                    character.difficulties.push(
                        boss?.difficulties[0]?.name || "기본"
                    );
                }

                character.difficulties =
                    character.difficulties.slice(
                        0,
                        data.bosses.length
                    );

                data.bosses.forEach((boss, bossIndex) => {
                    if (
                        !boss.difficulties.some(
                            difficulty =>
                                difficulty.name ===
                                character.difficulties[bossIndex]
                        )
                    ) {
                        character.difficulties[bossIndex] =
                            boss.difficulties[0]?.name || "기본";
                    }
                });
            });
        }

        function saveData() {
            try {
                localStorage.setItem(
                    storageKey,
                    JSON.stringify(data)
                );
            } catch (error) {
                console.error("데이터 저장에 실패했습니다.", error);
            }
        }

        function displayWeek() {
            const start = getWeekStart(new Date());
            const end = new Date(start);

            end.setDate(start.getDate() + 6);

            document.getElementById("weekInfo").textContent =
                `${formatDate(start)} (목) ~ ${formatDate(end)} (수)`;
        }

        function addCharacter(name) {
            data.characters.push({
                name: name,
                status: data.bosses.map(() => false),
                difficulties: data.bosses.map(
                    boss => boss.difficulties[0]?.name || "기본"
                )
            });
        }

        function addCharacterFromInput() {
            const characterInput =
                document.getElementById("characterInput");

            const characterName =
                characterInput.value.trim();

            if (characterName === "") {
                alert("캐릭터명을 입력해주세요.");
                return;
            }

            addCharacter(characterName);
            characterInput.value = "";

            saveData();
            renderTable();
        }

        function deleteCharacter(index) {
            const character = data.characters[index];

            if (!character) {
                return;
            }

            if (
                !confirm(
                    `"${character.name}" 캐릭터를 삭제할까요?`
                )
            ) {
                return;
            }

            data.characters.splice(index, 1);
            saveData();
            renderTable();
        }

        function getSelectedBossDifficulty(boss) {
            return boss.difficulties.find(
                difficulty =>
                    difficulty.name ===
                    boss.selectedDifficulty
            );
        }

        function getSelectedBossValue(boss) {
            const difficulty =
                getSelectedBossDifficulty(boss);

            return difficulty
                ? difficulty.value
                : 0;
        }

        function updateBossDifficulty(bossIndex, difficultyName) {
            const boss = data.bosses[bossIndex];

            if (!boss) {
                return;
            }

            boss.selectedDifficulty = difficultyName;

            saveData();
            renderTable();
        }

        function getCharacterDifficulty(character, bossIndex) {
            const boss = data.bosses[bossIndex];

            if (!boss) {
                return null;
            }

            return (
                boss.difficulties.find(
                    difficulty =>
                        difficulty.name ===
                        character.difficulties?.[bossIndex]
                ) ||
                boss.difficulties[0] ||
                null
            );
        }

        function getCharacterBossValue(character, bossIndex) {
            const difficulty =
                getCharacterDifficulty(
                    character,
                    bossIndex
                );

            return difficulty
                ? difficulty.value
                : 0;
        }

        function updateCharacterDifficulty(
            characterIndex,
            bossIndex,
            difficultyName
        ) {
            const character =
                data.characters[characterIndex];

            if (!character) {
                return;
            }

            character.difficulties[bossIndex] =
                difficultyName;

            saveData();
            renderTable();
        }

        function toggleStatus(characterIndex, bossIndex) {
            const character =
                data.characters[characterIndex];

            if (!character) {
                return;
            }

            if (!Array.isArray(character.status)) {
                character.status = [];
            }

            character.status[bossIndex] =
                !Boolean(
                    character.status[bossIndex]
                );

            saveData();
            renderTable();
        }

        function calculateBossProfit(bossIndex) {
            const boss =
                data.bosses[bossIndex];

            if (!boss) {
                return 0;
            }

            let total = 0;

            data.characters.forEach(character => {
                if (
                    character.status &&
                    character.status[bossIndex] === true
                ) {
                    total +=
                        getCharacterBossValue(
                            character,
                            bossIndex
                        );
                }
            });

            return total;
        }

        function calculateTotalProfit() {
            let total = 0;

            data.bosses.forEach((boss, index) => {
                total += calculateBossProfit(index);
            });

            return total;
        }

        function formatNumber(number) {
            return Number(number).toLocaleString("ko-KR");
        }

        function formatDecisionValue(number) {
            return `${formatNumber(number)} 만 메소`;
        }

            data.characters.forEach(character => {
                const movedStatus =
                    character.status.splice(
                        fromIndex,
                        1
                    )[0];

                character.status.splice(
                    toIndex,
                    0,
                    movedStatus
                );

                const movedDifficulty =
                    character.difficulties.splice(
                        fromIndex,
                        1
                    )[0];

                character.difficulties.splice(
                    toIndex,
                    0,
                    movedDifficulty
                );
            });

            saveData();
            renderTable();
        }

        let draggedCharacterIndex = null;

        function setupCharacterDrag(row, index) {
            row.draggable = true;

            row.addEventListener("dragstart", event => {
                draggedCharacterIndex = index;
                row.classList.add("dragging");

                event.dataTransfer.effectAllowed = "move";
                event.dataTransfer.setData(
                    "text/plain",
                    String(index)
                );
            });

            row.addEventListener("dragend", () => {
                row.classList.remove("dragging");
                draggedCharacterIndex = null;
            });

            row.addEventListener("dragover", event => {
                event.preventDefault();

                if (
                    draggedCharacterIndex === null ||
                    draggedCharacterIndex === index
                ) {
                    return;
                }

                event.dataTransfer.dropEffect = "move";
            });

            row.addEventListener("drop", event => {
                event.preventDefault();

                const fromIndex = draggedCharacterIndex;
                const toIndex = index;

                if (
                    fromIndex === null ||
                    fromIndex === toIndex
                ) {
                    return;
                }

                moveCharacter(fromIndex, toIndex);
            });
        }

        function moveCharacter(fromIndex, toIndex) {
            const movedCharacter =
                data.characters.splice(
                    fromIndex,
                    1
                )[0];

            data.characters.splice(
                toIndex,
                0,
                movedCharacter
            );

            saveData();
            renderTable();
        }

        function renderTable() {
            normalizeData();

            const header =
                document.getElementById("bossHeader");

            const table =
                document.getElementById("bossTable");

            header.innerHTML = "";
            table.innerHTML = "";

            const headerRow =
                document.createElement("tr");

            const corner =
                document.createElement("th");

            corner.className =
                "character-header";

            corner.textContent =
                "캐릭터 ＼ 보스";

            headerRow.appendChild(corner);

            data.bosses.forEach((boss, index) => {
                const th =
                    document.createElement("th");

                th.className =
                    "boss-header";

                const name =
                    document.createElement("span");

                name.className =
                    "boss-name";

                name.textContent =
                    boss.name;

                th.appendChild(name);
                headerRow.appendChild(th);
            });

            header.appendChild(headerRow);

            data.characters.forEach(
                (character, characterIndex) => {
                    const row =
                        document.createElement("tr");

                    row.className =
                        "character-row";

                    setupCharacterDrag(
                        row,
                        characterIndex
                    );

                    const nameCell =
                        document.createElement("td");

                    const nameSpan =
                        document.createElement("span");

                    nameSpan.className =
                        "character-name";

                    nameSpan.textContent =
                        character.name;

                    const deleteButton =
                        document.createElement("button");

                    deleteButton.type =
                        "button";

                    deleteButton.className =
                        "delete-character";

                    deleteButton.textContent =
                        "×";

                    deleteButton.title =
                        "캐릭터 삭제";

                    deleteButton.draggable =
                        false;

                    deleteButton.onclick =
                        event => {
                            event.stopPropagation();

                            deleteCharacter(
                                characterIndex
                            );
                        };

                    nameCell.appendChild(nameSpan);
                    nameCell.appendChild(deleteButton);
                    row.appendChild(nameCell);

                    data.bosses.forEach(
                        (boss, bossIndex) => {
                            const cell =
                                document.createElement("td");

                            const difficultySelect =
                                document.createElement("select");

                            difficultySelect.className =
                                "difficulty-select";

                            boss.difficulties.forEach(
                                difficulty => {
                                    const option =
                                        document.createElement("option");

                                    option.value =
                                        difficulty.name;

                                    option.textContent =
                                        difficulty.name;

                                    if (
                                        difficulty.name ===
                                        character.difficulties[bossIndex]
                                    ) {
                                        option.selected =
                                            true;
                                    }

                                    difficultySelect.appendChild(
                                        option
                                    );
                                }
                            );

                            difficultySelect.addEventListener(
                                "change",
                                event => {
                                    event.stopPropagation();

                                    updateCharacterDifficulty(
                                        characterIndex,
                                        bossIndex,
                                        difficultySelect.value
                                    );
                                }
                            );

                            difficultySelect.addEventListener(
                                "mousedown",
                                event => {
                                    event.stopPropagation();
                                }
                            );

                            difficultySelect.addEventListener(
                                "click",
                                event => {
                                    event.stopPropagation();
                                }
                            );

                            const button =
                                document.createElement("button");

                            button.type =
                                "button";

                            button.draggable =
                                false;

                            const isDone =
                                character.status &&
                                character.status[bossIndex] === true;

                            button.textContent =
                                isDone
                                    ? "O"
                                    : "X";

                            button.className =
                                "status-button " +
                                (
                                    isDone
                                        ? "done"
                                        : "not-done"
                                );

                            button.onclick =
                                event => {
                                    event.stopPropagation();

                                    toggleStatus(
                                        characterIndex,
                                        bossIndex
                                    );
                                };

                            cell.appendChild(
                                difficultySelect
                            );

                            cell.appendChild(
                                document.createElement("br")
                            );

                            cell.appendChild(button);
                            row.appendChild(cell);
                        }
                    );

                    table.appendChild(row);
                }
            );

            const profitRow =
                document.createElement("tr");

            profitRow.className =
                "profit-row";

            const profitTitle =
                document.createElement("th");

            profitTitle.textContent =
                "총 수익";

            profitRow.appendChild(profitTitle);

            data.bosses.forEach((boss, index) => {
                const td =
                    document.createElement("td");

                td.textContent =
                    formatDecisionValue(
                        calculateBossProfit(index)
                    );

                profitRow.appendChild(td);
            });

            table.appendChild(profitRow);

            document.getElementById(
                "totalProfit"
            ).textContent =
                `이번 주 총 수익: ${formatDecisionValue(
                    calculateTotalProfit()
                )}`;
        }

        function toggleSchedulerMenu() {
            const menu =
                document.getElementById("schedulerMenu");

            menu.classList.toggle("active");
        }

        document.addEventListener(
            "click",
            function(event) {
                const menu =
                    document.getElementById("schedulerMenu");

                if (!menu.contains(event.target)) {
                    menu.classList.remove("active");
                }
            }
        );

        document.getElementById(
            "characterInput"
        ).addEventListener(
            "keydown",
            function(event) {
                if (event.key === "Enter") {
                    addCharacterFromInput();
                }
            }
        );

        normalizeData();
        saveData();

        displayWeek();
        renderTable();
    </script>

</body>
</html>
